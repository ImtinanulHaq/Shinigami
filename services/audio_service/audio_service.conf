# audio_service.conf — audio service configuration
# Environment variable override: AUDIO_SERVICE_<SECTION>_<KEY>=value

[server]
socket_path        = /tmp/servicemanager.sock
log_file           = /var/log/audio_service.log
log_level          = INFO
pid_file           = /run/audio_service.pid

[hardware]
# ALSA PCM device name
device             = default
sample_rate        = 44100
channels           = 2
# Period in frames; determines ring buffer item size
period_size        = 1024
# Format: S16_LE | S32_LE | FLOAT_LE
format             = S16_LE
# Number of periods in hardware buffer
buffer_count       = 4

[security]
verify_key_file    = /etc/audio_service/hmac.key
enable_sandbox     = 1
enable_seccomp     = 1
enable_capabilities = 1

[health]
ping_interval_sec      = 5
reconnect_backoff_max  = 30
