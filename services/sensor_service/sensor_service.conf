# sensor_service.conf — sensor service configuration
# Environment variable override: SENSOR_SERVICE_<SECTION>_<KEY>=value

[server]
socket_path        = /tmp/servicemanager.sock
log_file           = /var/log/sensor_service.log
log_level          = INFO
pid_file           = /run/sensor_service.pid

[hardware]
# IIO device path
device             = /dev/iio:device0
# accel | gyro | mag | temperature | pressure | humidity
sensor_type        = accel
# Sampling rate in Hz
sampling_rate_hz   = 100
# Full-scale range (device-specific units, e.g. ±2g for accel)
full_scale_range   = 2

[security]
verify_key_file    = /etc/sensor_service/hmac.key
enable_sandbox     = 1
enable_seccomp     = 1
enable_capabilities = 1

[health]
ping_interval_sec      = 5
reconnect_backoff_max  = 30
