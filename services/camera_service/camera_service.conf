# camera_service.conf — camera service configuration
# Environment variable override: CAMERA_SERVICE_<SECTION>_<KEY>=value

[server]
socket_path        = /tmp/servicemanager.sock
log_file           = /var/log/camera_service.log
log_level          = INFO
pid_file           = /run/camera_service.pid

[hardware]
# V4L2 device node
device             = /dev/video0
width              = 1280
height             = 720
fps                = 30
# Number of V4L2 MMAP buffers to allocate
buffer_count       = 4
# Pixel format: YUYV | MJPEG
format             = YUYV

[security]
verify_key_file    = /etc/camera_service/hmac.key
enable_sandbox     = 1
enable_seccomp     = 1
enable_capabilities = 1

[health]
ping_interval_sec      = 5
reconnect_backoff_max  = 30
