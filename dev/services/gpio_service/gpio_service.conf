# gpio_service.conf — GPIO service configuration
# Environment variable override: GPIO_SERVICE_<SECTION>_<KEY>=value

[server]
socket_path        = /tmp/servicemanager.sock
log_file           = /var/log/gpio_service.log
log_level          = INFO
pid_file           = /run/gpio_service.pid

[hardware]
# GPIO chip device (gpiochip0 etc.)
chip               = gpiochip0
# GPIO pin / line number on the chip
pin_number         = 4
# in | out
direction          = in
# Initial output value (ignored for input pins)
initial_value      = 0
# Edge detection: rising | falling | both | none
edge               = both
# Timeout in ms for gpio_hal_wait_interrupt; 0 = non-blocking
interrupt_timeout_ms = 0

[security]
verify_key_file    = /etc/gpio_service/hmac.key
enable_sandbox     = 1
enable_seccomp     = 1
enable_capabilities = 1
skip_sandbox        = 1
skip_seccomp        = 1
skip_capabilities   = 1
skip_verify         = 1
skip_hal_init       = 1
ping_interval_sec      = 5
reconnect_backoff_max  = 30
